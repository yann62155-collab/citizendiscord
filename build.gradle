plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.138'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Version imposée : NeoForge 21.1.215 exactement
    version = neo_version  // net.neoforged:neoforge:21.1.215
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, neo_version: neo_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
